<header class="site-header">
  <div class="wrap">
    <nav class="nav-shell" aria-label="Điều hướng chính">

      <a class="header-logo-link"
         href="{{ '/' | relative_url }}"
         aria-label="Littlest Things — Trang chủ">
        <img
          class="logo"
          src="{{ '/assets/brand/01-primary-horizontal/littlest-things-botanical-primary.svg' | relative_url }}"
          alt="Littlest Things">
      </a>

      <div class="nav-links">
        <a
          class="{% if page.url == '/' %}active{% endif %}"
          href="{{ '/' | relative_url }}">
          Trang chủ
        </a>

        <a
          class="{% if page.url contains 'kham-pha' %}active{% endif %}"
          href="{{ '/kham-pha/' | relative_url }}">
          Khám Phá
        </a>

        <a
          class="{% if page.url contains 'skin-profile' %}active{% endif %}"
          href="{{ '/skin-profile/' | relative_url }}">
          Skin Profile
        </a>

        <span class="nav-link-static" aria-disabled="true">
          Sản Phẩm
        </span>
      </div>

      <button
        class="mobile-menu"
        id="menuButton"
        type="button"
        aria-controls="menuPanel"
        aria-expanded="false"
        aria-label="Mở menu">
        <img
          class="lt-icon lt-icon--menu"
          src="{{ '/assets/icons/svg/ui/menu.svg' | relative_url }}"
          alt=""
          aria-hidden="true">
      </button>

      <div class="menu-panel" id="menuPanel">
        <a href="{{ '/' | relative_url }}">Trang chủ</a>
        <a href="{{ '/kham-pha/' | relative_url }}">Khám Phá</a>
        <a href="{{ '/skin-profile/' | relative_url }}">Skin Profile</a>
        <span class="menu-link-static" aria-disabled="true">Sản Phẩm</span>
      </div>

    </nav>
  </div>
</header>
