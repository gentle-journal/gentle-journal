title: "Littlest Things"
tagline: "Nhật Ký Da Nhạy Cảm"
description: "Littlest Things về chăm sóc da, tóc và du lịch — thành thật, có ngữ cảnh và có căn cứ."
lang: vi
baseurl: ""
url: "https://littlestthings.net"

markdown: kramdown
permalink: /:categories/:title/

collections:
  reviews:
    output: true
    permalink: /reviews/:name/
  kien-thuc:
    output: true
    permalink: /kien-thuc-da/:name/
  nhat-ky:
    output: true
    permalink: /nhat-ky/:name/
  so-sanh:
    output: true
    permalink: /so-sanh/:name/

defaults:
  - scope:
      path: ""
      type: "reviews"
    values:
      layout: "post"
      section: "Review"
      content_type: "article"
      published: true
  - scope:
      path: ""
      type: "kien-thuc"
    values:
      layout: "post"
      section: "Kiến Thức"
      content_type: "article"
      published: true
  - scope:
      path: ""
      type: "nhat-ky"
    values:
      layout: "post"
      section: "Nhật Ký"
      content_type: "article"
      published: true
  - scope:
      path: ""
      type: "so-sanh"
    values:
      layout: "post"
      section: "So Sánh"
      content_type: "article"
      published: true
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  sass_dir: _sass
