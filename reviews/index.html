---
layout: default
title: Review
permalink: /reviews/
---
<h1 class="stitch">Review</h1>
<p class="excerpt">Đánh giá sản phẩm dựa trên trải nghiệm dùng thật, ít nhất 2–4 tuần.</p>
{% for post in site.reviews %}
<div class="card">
  <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
  <p class="excerpt">{{ post.excerpt | strip_html | truncate: 140 }}</p>
  <div class="meta">{{ post.date | date: "%d/%m/%Y" }}</div>
</div>
{% endfor %}
