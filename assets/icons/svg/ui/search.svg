  <g stroke-width="0.79" opacity=".22" transform="translate(-.28 -.20)" stroke-dasharray="2.6 .35 4.2 .3"><circle cx="9.8" cy="9.8" r="5.2"/><path d="M13.7 13.7 19.3 19.3"/></g>
</g>

<circle cx="5.5" cy="5.3" r="0.45" fill="var(--icon-accent, currentColor)" opacity="0.45"/><circle cx="18.6" cy="8.0" r="0.35" fill="var(--icon-accent, currentColor)" opacity="0.35"/>
